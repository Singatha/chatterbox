[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatterbox-backend"
version = "0.1.0"
description = "FastAPI backend for a realtime chat application"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "email-validator>=2.1,<3",
  "fastapi>=0.115,<0.142",
  "minio>=7.2,<8",
  "opentelemetry-api>=1.37,<1.38",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<1.38",
  "opentelemetry-instrumentation-fastapi>=0.58b0,<0.59",
  "opentelemetry-instrumentation-sqlalchemy>=0.58b0,<0.59",
  "opentelemetry-sdk>=1.37,<1.38",
  "prometheus-client>=0.20,<1",
  "pydantic-settings>=2.5,<3",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.9,<3",
  "redis>=5.0,<6",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "fakeredis[lua]>=2.25,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP045"] # Optional keeps SQLAlchemy annotations compatible with Python 3.9.
